name: simak_mobile
description: "Aplikasi Akademik Mobile Universitas SIMAK (Clean Architecture + BLoC)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  go_router: ^14.8.1
  get_it: ^8.0.3
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  equatable: ^2.0.7
  shimmer: ^3.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.dev
